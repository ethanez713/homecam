syntax = "proto3";

package homecam;

option java_package = "com.homecam.proto";
option java_multiple_files = true;

// ---------------------------------------------------------------- SESSION (1)

message SessionConfig {
  enum Mode {
    LIVE = 0;
    AUDIO_ONLY = 1;
    LOW_BANDWIDTH = 2;
  }
  bool video = 1;
  bool audio = 2;
  Mode mode = 3;
}

message PushToTalk { bool active = 1; }
message ManualRecord { bool recording = 1; uint32 seconds = 2; }

// Pushed to the requesting viewer when its manual clip closes, so it learns the clip id
// without polling the list (Phase 4).
message ManualRecordResult { string clip_id = 1; int64 started_at_ms = 2; uint32 duration_ms = 3; }
message Torch { bool on = 1; }
message Orientation { uint32 degrees = 1; }
message Resolution { uint32 width = 1; uint32 height = 2; uint32 fps = 3; }
message Zoom { float ratio = 1; }
message Lens { enum Facing { BACK = 0; FRONT = 1; } Facing facing = 1; }

// Response actions (Phase 8). The siren plays through the camera phone's own speaker and
// stops itself after [seconds]; the spotlight is the torch used deliberately as a light.
message Siren { bool on = 1; uint32 seconds = 2; }
message Spotlight { bool on = 1; }

// A single still, served straight from the live capture without opening a media session —
// reading a frame must not cost an H.264 encode (Phase 1). Dimensions are the capture
// format's, so a viewer can lay boxes over it without guessing.
message Snapshot { bytes jpeg = 1; uint32 width = 2; uint32 height = 3; }

// --------------------------------------------------------------- SETTINGS (2)

message SettingsSnapshot {
  bool armed = 1;
  string alias = 2;
  bool microphone = 3;
  bool low_light = 4;
  DetectionMode detection_mode = 16;
  DetectionSchedule detection_schedule = 17;
  DetectionZone detection_zone = 18;
  PrivacyMask privacy_mask = 19;
  bool bounding_box_overlay = 22;
  DetectionReminder detection_reminder = 23;
  SoundDetection sound_detection = 24;
  SoundRecognition sound_recognition = 25;
  bool auto_spotlight = 26;
  RetentionPolicy retention = 32;
  RecordingMode recording_mode = 33;
  HardwareProtection hardware_protection = 35;
  // Set while a timed recording mode is running; the camera enforces it (Phase 11.7).
  RecordingRevert recording_revert = 36;
}

// The decibel half of sound detection (Phase 6): a loud noise above [threshold_db] fires,
// no model required. Independent of the vision pipeline, as it is in Alfred.
message SoundDetection { bool enabled = 1; float threshold_db = 2; }

// Which recognised sound classes count, when the classifier is enabled. Empty means the
// decibel trigger only. Class names are the small user-facing set from models/README.md.
message SoundRecognition { repeated string classes = 1; }

// Periodically reminds the owner the camera is armed and detecting, so a camera quietly
// recording an occupied house is not a surprise (§2.7). A privacy control, not a nag.
message DetectionReminder { bool enabled = 1; uint32 interval_minutes = 2; }
message AutoSpotlight { bool enabled = 1; }

// What the camera keeps, distinct from whether it is armed (that is whether it watches).
// DETECTION is field default 0 so a fresh install keeps clips around detections, which is
// the sane default; CONTINUOUS is the gap-free record, OFF keeps nothing (Phase 4).
enum RecordingMode {
  DETECTION = 0;
  OFF = 1;
  CONTINUOUS = 2;
}

// A request may name how long the mode holds. The duration is relative so a viewer whose
// clock differs from the camera's still gets the hour it asked for; the camera stores the
// absolute time. Zero minutes means until someone changes it.
message RecordingModeSetting {
  RecordingMode mode = 1;
  uint32 revert_after_minutes = 2;
  RecordingMode revert_to = 3;
}

message RecordingRevert {
  int64 at_ms = 1;
  RecordingMode to = 2;
}

// Whether the camera may cap its own recording to protect the phone (Phase 11). Absent from
// a snapshot means the defaults: both rungs on, pausing at 30 %. Past CRITICAL the camera
// caps regardless, because the risk there is the battery, not the footage.
message HardwareProtection {
  bool thermal_auto_pause = 1;
  bool battery_auto_pause = 2;
  uint32 battery_pause_percent = 3;
}

message Armed { bool armed = 1; }
message Alias { string alias = 1; }
message Microphone { bool enabled = 1; }
message LowLight { bool enabled = 1; }

message DetectionMode {
  bool person = 1;
  bool vehicle = 2;
  bool pet = 3;
  bool package = 4;
  bool motion_only = 5;
  float min_confidence = 6;
}

message DetectionSchedule {
  message Window {
    // Minutes past local midnight.
    uint32 start_minute = 1;
    uint32 end_minute = 2;
    // Bit 0 = Monday .. bit 6 = Sunday.
    uint32 days_mask = 3;
  }
  bool enabled = 1;
  repeated Window windows = 2;
}

message Point { float x = 1; float y = 2; }

// Normalised polygon; detection runs only inside it.
message DetectionZone { repeated Point points = 1; bool enabled = 2; }

// Normalised rectangles blanked in the frame before it reaches the encoder, so
// masked areas exist in neither the live stream nor the recording (§2.8).
message PrivacyMask {
  message Rect { float left = 1; float top = 2; float right = 3; float bottom = 4; }
  repeated Rect rects = 1;
}

message BoundingBoxOverlay { bool enabled = 1; }

message RetentionPolicy {
  uint32 max_age_days = 1;
  uint32 max_size_gb = 2;
  uint32 min_free_space_gb = 3;
}

// ----------------------------------------------------------------- STATUS (3)

message RuntimeStatus {
  float battery_percent = 1;
  bool charging = 2;
  float battery_temp_c = 3;
  int64 free_bytes = 4;
  int64 clip_bytes = 5;
  float capture_fps = 6;
  int64 uptime_ms = 7;
  bool armed = 8;
  uint32 viewers_with_access = 9;
  string camera_alias = 10;
  float detector_fps = 11;
  bool thermal_throttled = 12;

  // Phase 11. Readings the camera protects itself with, and what it is doing about them.
  Thermal thermal_status = 13;
  // NaN when the platform cannot say (below API 30).
  float thermal_headroom = 14;
  // Never negative; zero while charging or before there are enough samples.
  float drain_percent_per_hour = 15;
  // BatteryManager.EXTRA_HEALTH as the platform reports it; zero when absent.
  int32 battery_health = 16;
  Level thermal_level = 17;
  Level battery_level = 18;
  Level storage_level = 19;
  Cap cap = 20;
  CapReason cap_reason = 21;
  int64 cap_since_ms = 22;
  // The requested recording_mode with the cap applied; the setting itself is never rewritten.
  RecordingMode effective_recording_mode = 23;
  int64 pinned_bytes = 24;
  int64 floor_bytes = 25;
  bool floor_held = 26;
  // Zero when no timed recording mode is running.
  int64 recording_revert_at_ms = 27;
  RecordingMode recording_revert_to = 28;
  // The recording_mode setting as asked for; effective_recording_mode is what it came to.
  RecordingMode requested_recording_mode = 29;

  // THERMAL_UNKNOWN is below API 29, where only battery_temp_c speaks for heat.
  enum Thermal {
    THERMAL_UNKNOWN = 0;
    THERMAL_NONE = 1;
    THERMAL_LIGHT = 2;
    THERMAL_MODERATE = 3;
    THERMAL_SEVERE = 4;
    THERMAL_CRITICAL = 5;
    THERMAL_EMERGENCY = 6;
    THERMAL_SHUTDOWN = 7;
  }

  enum Level {
    LEVEL_OK = 0;
    LEVEL_WARN = 1;
    LEVEL_PAUSE = 2;
    LEVEL_CRITICAL = 3;
  }

  enum Cap {
    CAP_NONE = 0;
    CAP_NO_CONTINUOUS = 1;
    CAP_NO_RECORDING = 2;
  }

  enum CapReason {
    REASON_NONE = 0;
    REASON_THERMAL = 1;
    REASON_STORAGE = 2;
    REASON_BATTERY = 3;
  }
}

message SessionStatus {
  string session_id = 1;
  bool active = 2;
  int64 started_at_ms = 3;
  uint32 video_width = 4;
  uint32 video_height = 5;
  uint32 bitrate_kbps = 6;
  uint32 rtt_ms = 7;
  uint32 packets_lost = 8;
  // Quarter-turn applied to the capture, so a viewer can confirm a rotation took effect.
  uint32 orientation_degrees = 9;
}

// ------------------------------------------------------------------ MEDIA (4)

message Clip {
  string id = 1;
  int64 started_at_ms = 2;
  uint32 duration_ms = 3;
  int64 size_bytes = 4;
  bool pinned = 5;
  repeated string labels = 6;
  uint32 width = 7;
  uint32 height = 8;
  bool has_audio = 9;
}

message ClipList {
  // Request fields.
  int64 since_ms = 1;
  int64 until_ms = 2;
  uint32 limit = 3;
  // Response field.
  repeated Clip clips = 4;
}

message ClipDelete { string id = 1; bool deleted = 2; }
message Thumbnail { string clip_id = 1; bytes jpeg = 2; }
message ClipData { string clip_id = 1; int64 offset = 2; bytes chunk = 3; bool eof = 4; }
message DateList { repeated string dates = 1; repeated uint32 counts = 2; }

message TimelineQuery {
  int64 since_ms = 1;
  int64 until_ms = 2;
  message Entry { int64 at_ms = 1; string clip_id = 2; string label = 3; }
  repeated Entry entries = 3;
}

message ClipPin { string id = 1; bool pinned = 2; }

// A density strip for the timeline (Phase 10): how many events fall in each time bucket of
// a range, so the viewer can show which hours had activity without downloading every event.
message TimelineCount {
  int64 since_ms = 1;
  int64 until_ms = 2;
  int64 bucket_ms = 3;
  message Bucket { int64 at_ms = 1; uint32 count = 2; }
  repeated Bucket buckets = 4;
}

// ------------------------------------------------------------------ AUDIT (5)

message AuditEvent {
  enum Kind {
    UNSPECIFIED = 0;
    SESSION_OPENED = 1;
    SESSION_CLOSED = 2;
    CLIP_VIEWED = 3;
    CLIP_DELETED = 4;
    SETTINGS_CHANGED = 5;
    PRIVACY_MASK_EDITED = 6;
    PAIRING_STARTED = 7;
    PAIRING_COMPLETED = 8;
    PAIRING_EXPIRED = 9;
    VIEWER_REVOKED = 10;
    CONNECTION_REJECTED = 11;
    FINGERPRINT_MISMATCH = 12;
    CAMERA_STARTED = 13;
    CAMERA_STOPPED = 14;
    DETECTION = 15;
    RESPONSE_ACTION = 16;
  }
  uint64 seq = 1;
  int64 at_ms = 2;
  Kind kind = 3;
  string viewer_fingerprint = 4;
  string viewer_label = 5;
  string source_ip = 6;
  string detail = 7;
  // SHA-256 over (previous entry hash || this entry's canonical bytes). Editing
  // or deleting a row breaks the chain from that point on (§2.7).
  bytes chain_hash = 8;
  bytes prev_hash = 9;
}

message AuditQuery {
  int64 since_ms = 1;
  int64 until_ms = 2;
  uint32 limit = 3;
  repeated AuditEvent.Kind kinds = 4;
  repeated AuditEvent events = 5;
  bool chain_valid = 6;
  uint64 first_broken_seq = 7;
}

// ----------------------------------------------------------------- ACCESS (6)

message Viewer {
  bytes public_key = 1;
  string fingerprint = 2;
  string label = 3;
  int64 paired_at_ms = 4;
  int64 last_seen_ms = 5;
  uint32 sessions_30d = 6;
  bool online = 7;
}

message ViewerList { repeated Viewer viewers = 1; }
message RevokeViewer { string fingerprint = 1; bool all = 2; bool revoked = 3; }

/**
 * How a viewer asks to be told about things. Sent over the authenticated RPC channel
 * rather than in the handshake, so alert settings can be changed without re-pairing.
 */
message AlertRegistration {
  bytes alert_public_key = 1;
  // Random per viewer, so the push provider cannot correlate topics with anything.
  string topic = 2;
  string endpoint = 3;
  bool enabled = 4;
  bool session_alerts = 5;
  bool detection_alerts = 6;
  // Absent means on, so a viewer that predates health alerts still gets them.
  optional bool health_alerts = 7;
}

message PairingMode {
  bool active = 1;
  int64 expires_at_ms = 2;
  // Only ever sent camera->camera-UI; never over the wire to a viewer.
  bytes invite = 3;
}

// ------------------------------------------------------------- DETECTION

/**
 * One sample of the clip's timed-metadata track. Muxing detections into the MP4 is what
 * makes a clip a self-describing artifact: copy it anywhere and the boxes travel with it,
 * with no sidecar and no server to ask.
 */
message DetectionFrame {
  message Box {
    string label = 1;
    float confidence = 2;
    float left = 3;
    float top = 4;
    float right = 5;
    float bottom = 6;
  }
  int64 at_ms = 1;
  repeated Box boxes = 2;
}

// ----------------------------------------------------------------- ALERTS

/**
 * What a detection alert says, *before* encryption. This never travels in the clear: the
 * camera seals it to the viewer's agreement key and posts only the ciphertext, so the
 * push provider sees opaque bytes and a random topic name rather than a thumbnail of
 * somebody's living room (§2.8).
 */
message AlertPayload {
  int64 at_ms = 1;
  string camera_alias = 2;
  string camera_fingerprint = 3;
  repeated string labels = 4;
  string clip_id = 5;
  bytes thumbnail_jpeg = 6;
}

// ------------------------------------------------------------- CAPABILITY

/**
 * What each end supports, exchanged *after* authentication (never as part of deciding
 * trust). The dispatcher already drops unknown control ids silently, which stops a version
 * mismatch from erroring; this exists so the UI can be honest about what will actually
 * work rather than offering a control the camera cannot honour (Phase 2).
 *
 * Presence is modelled as explicit named fields rather than a bitmask: a bitmask saves
 * bytes nobody is short of and costs readability every time it is debugged.
 */
message Capabilities {
  // Whichever end has the lower version decides what is safe to speak.
  uint32 protocol_version = 1;
  // Camera can turn on a flash unit.
  bool torch = 2;
  // Response actions (Phase 8); false until the hardware/logic exists.
  bool siren = 3;
  bool spotlight = 4;
  // Both a front and a back lens are present.
  bool multi_lens = 5;
  // Camera has a microphone, so it can send audio to the viewer.
  bool audio_in = 6;
  // Camera can play the viewer's audio, so push-to-talk has somewhere to land.
  bool audio_out = 7;
  // Decibel / sound-event triggers (Phase 6); false until then.
  bool sound_detection = 8;
  // Camera can record with nobody watching.
  bool continuous_recording = 9;
  EncoderTier hardware_encoder_tier = 10;
  // The resolutions the camera can actually produce, best first.
  repeated Resolution resolutions = 11;
  // Phase 11: the camera watches its own heat, battery and storage and caps recording.
  bool hardware_protection = 12;
  // The platform reports a thermal status (API 29+); otherwise only battery temperature.
  bool thermal_status_supported = 13;

  enum EncoderTier {
    ENCODER_NONE = 0;  // software encode only
    ENCODER_H264 = 1;  // hardware H.264
    ENCODER_HEVC = 2;  // hardware HEVC (and H.264)
  }
}
