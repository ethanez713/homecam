syntax = "proto3";

package homecam;

option java_package = "com.homecam.proto";
option java_multiple_files = true;

// The single envelope for everything that is not media. Carried on the WebRTC
// DataChannel. See docs/PLAN.md §4.2.
message RpcMessage {
  enum Type {
    REQUEST = 0;
    RESPONSE = 1;
    STREAM = 2;
    NOTIFICATION = 3;
    ERROR = 4;
  }

  enum Service {
    RESERVED = 0;
    SESSION = 1;
    SETTINGS = 2;
    STATUS = 3;
    MEDIA = 4;
    AUDIT = 5;
    ACCESS = 6;
    CAPABILITY = 7;
  }

  Type type = 1;
  Service service = 2;
  // Method id, scoped to the service. Allocated in sparse blocks: 0-15 core,
  // 16-31 detection, 32-47 storage, 64+ later additions, so features can be
  // added for years without renumbering.
  uint32 control = 3;
  // Correlation id, echoed on the response.
  uint32 id = 4;
  bytes payload = 5;
}

// Payload of an ERROR response. Alfred drops failures silently; we don't.
message RpcError {
  enum Code {
    UNKNOWN = 0;
    UNIMPLEMENTED = 1;
    INVALID_ARGUMENT = 2;
    FAILED_PRECONDITION = 3;
    NOT_FOUND = 4;
    PERMISSION_DENIED = 5;
    INTERNAL = 6;
    UNAVAILABLE = 7;
    DEADLINE_EXCEEDED = 8;
  }
  Code code = 1;
  string message = 2;
}
